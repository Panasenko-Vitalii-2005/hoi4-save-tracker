services:
  postgres:
    image: postgres:17-alpine
    environment:
      POSTGRES_DB: ${POSTGRES_DB:-hoi4_tracker}
      POSTGRES_USER: ${POSTGRES_USER:-hoi4_tracker}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-hoi4_tracker_dev_only}
    volumes:
      - postgres-data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U $${POSTGRES_USER} -d $${POSTGRES_DB}"]
      interval: 5s
      timeout: 5s
      retries: 12
      start_period: 5s

  migrate:
    build:
      context: .
      dockerfile: server/Dockerfile
    command: ["node", "dist/src/database/migrate.js", "up"]
    environment:
      DATABASE_URL: ${DATABASE_URL:-postgresql://hoi4_tracker:hoi4_tracker_dev_only@postgres:5432/hoi4_tracker}
    depends_on:
      postgres:
        condition: service_healthy
    restart: "no"

  backend:
    build:
      context: .
      dockerfile: server/Dockerfile
    environment:
      PORT: 3001
      HOI4_CORS_ORIGIN: ${HOI4_CORS_ORIGIN:-http://localhost:8081}
      HOI4_DATABASE_ENABLED: ${HOI4_DATABASE_ENABLED:-true}
      DATABASE_URL: ${DATABASE_URL:-postgresql://hoi4_tracker:hoi4_tracker_dev_only@postgres:5432/hoi4_tracker}
      HOI4_SESSION_TTL_SECONDS: ${HOI4_SESSION_TTL_SECONDS:-604800}
      HOI4_SESSION_COOKIE_SECURE: ${HOI4_SESSION_COOKIE_SECURE:-false}
      HOI4_LOCAL_SAVES_ENABLED: ${HOI4_LOCAL_SAVES_ENABLED:-false}
      HOI4_SAVES_DIR: /app/saves
      HOI4_RECENT_ANALYSES_FILE: /app/data/recent-analyses.json
      HOI4_ANALYSIS_RESULTS_DIR: /app/data/analysis-results
      HOI4_SHARED_ANALYSES_FILE: /app/data/shared-analyses.json
      # Logical compressed-artifact budget; not a filesystem reservation.
      HOI4_ANALYSIS_RESULTS_MAX_BYTES: ${HOI4_ANALYSIS_RESULTS_MAX_BYTES:-134217728}
      HOI4_RECENT_ANALYSES_LIMIT: ${HOI4_RECENT_ANALYSES_LIMIT:-200}
      HOI4_SHARED_ANALYSES_LIMIT: ${HOI4_SHARED_ANALYSES_LIMIT:-1000}
      HOI4_ANALYSIS_CACHE_ENTRIES: ${HOI4_ANALYSIS_CACHE_ENTRIES:-3}
      HOI4_TRENDS_CACHE_SNAPSHOTS: ${HOI4_TRENDS_CACHE_SNAPSHOTS:-2048}
      HOI4_TRENDS_CACHE_BYTES: ${HOI4_TRENDS_CACHE_BYTES:-67108864}
      HOI4_MAX_UPLOAD_BYTES: ${HOI4_MAX_UPLOAD_BYTES:-268435456}
      HOI4_MAX_UNCOMPRESSED_BYTES: ${HOI4_MAX_UNCOMPRESSED_BYTES:-536870912}
      HOI4_UPLOAD_TIMEOUT_MS: ${HOI4_UPLOAD_TIMEOUT_MS:-120000}
      HOI4_ANALYSIS_TIMEOUT_MS: ${HOI4_ANALYSIS_TIMEOUT_MS:-60000}
      HOI4_ANALYSIS_HEAP_MB: ${HOI4_ANALYSIS_HEAP_MB:-1024}
      HOI4_ANALYSIS_WORKERS: ${HOI4_ANALYSIS_WORKERS:-1}
      HOI4_ANALYSIS_REQUESTS: ${HOI4_ANALYSIS_REQUESTS:-2}
    volumes:
      - ./saves:/app/saves:ro
      - analysis-history:/app/data
    expose:
      - "3001"
    depends_on:
      migrate:
        condition: service_completed_successfully
    healthcheck:
      test:
        - CMD
        - node
        - -e
        - "fetch('http://127.0.0.1:3001/api/health').then(r => { if (!r.ok) process.exit(1) }).catch(() => process.exit(1))"
      interval: 10s
      timeout: 5s
      retries: 6
      start_period: 10s

  frontend:
    build:
      context: .
      dockerfile: client/Dockerfile
    depends_on:
      backend:
        condition: service_healthy
    ports:
      - "${FRONTEND_PORT:-8081}:80"
    healthcheck:
      test: ["CMD", "wget", "-q", "--spider", "http://127.0.0.1/"]
      interval: 10s
      timeout: 5s
      retries: 6
      start_period: 5s

volumes:
  analysis-history:
  postgres-data:
